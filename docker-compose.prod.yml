services:
  postgres-prod:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - psql_data_prod:/var/lib/postgresql/data
    ports:
      - '${DATABASE_PORT}:5432'

  webapp-prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: locklite-webapp:latest
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      - postgres-prod

volumes:
  psql_data_prod:
